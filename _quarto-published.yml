# Drafts left out of the site until they are published: lecture 13 and its
# game. Review them with `quarto render <file> --profile drafts`, which
# replaces this default profile.
# A draft rendered that way lands in `_site/`, and publishing deploys `_site/`
# as it is: run a full `uv run quarto render` before publishing, it removes
# the draft pages again.
project:
  render:
    - "!lectures/lecture-13-ondemand.qmd"
    - "!games/buses.qmd"
