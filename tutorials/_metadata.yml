#institute: "University of Hamburg - Fall 2024"
format:
  html: default
  typst: default
  hugo-md: default
  ipynb: default

# ipynb stays in `format` above only as the input for
# helpers/convert_pypercent.py, which derives the .jl percent files and then
# deletes the notebooks from _site. Students only ever see the Julia button.
format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf

execute:
  echo: true
