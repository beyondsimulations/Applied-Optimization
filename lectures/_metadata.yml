institute: "University of Hamburg"

format:
  html: default
  typst: default
  revealjs:
    # One stage for every course: 16:9 (Lecture-Foundations, research/slide-sizes.md).
    width: 1280
    height: 720
    include-in-header:
      - ../general/mathjax.html
    theme:
      - default
      - ../styles.scss
      - brand
    transition: slide
    transition-speed: fast
    highlight-style: github
    callout-appearance: simple
    slide-number: true
    code-copy: true
    code-link: true
    preview-links: auto

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf
  - revealjs

execute:
  echo: true

filters:
  - ../helpers/page-headings.lua
