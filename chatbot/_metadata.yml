# The introduction of the course chatbot: a deck and a reading page, no PDF.
# A folder's format list replaces the project's, so `typst` is left out here.
institute: "University of Hamburg"

format:
  html: default
  revealjs:
    # One stage for every course: 16:9 (Lecture-Foundations, research/slide-sizes.md).
    width: 1280
    height: 720
    theme:
      - default
      - ../styles.scss
      - brand
    transition: slide
    transition-speed: fast
    callout-appearance: simple
    slide-number: true
    preview-links: auto

format-links:
  - html
  - revealjs
